name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee validation.log
      - name: Lint
        run: npm run lint 2>&1 | tee validation.log
      - name: Tests
        run: npm test 2>&1 | tee validation.log
      - name: Production-like Vite build
        run: npx vite build 2>&1 | tee validation.log
      - name: Compile-only production build
        run: npm run build:compile 2>&1 | tee validation.log
      - name: Report validation failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Validation failed. Last output:'
            echo
            echo '```'
            tail -n 120 validation.log
            echo '```'
          } > validation-comment.md
          gh pr comment "$PR_NUMBER" --body-file validation-comment.md


  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser smoke
        run: npm run test:compat
